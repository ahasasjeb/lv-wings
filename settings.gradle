pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = "lv-wings-fabric-neoforge"

include 'fabric'
// 快照 / RC 迁移时可用 -PfabricOnly=true，避免配置不支持该游戏版本的 NeoForge。
if (!providers.gradleProperty('fabricOnly').map { it.toBoolean() }.getOrElse(false)) {
    include 'neoforge'
}
