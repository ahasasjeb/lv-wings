org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# 本机 JDK 25 安装路径，供 Java toolchain 检测（Gradle 默认只扫描系统盘，D 盘需要显式声明）
org.gradle.java.installations.paths=D:\\Program Files\\Java\\jdk-25

minecraft_version=26.3
minecraft_version_range=[26.3]

loom_version=1.17-SNAPSHOT
fabric_loader_version=0.19.5
fabric_api_version=0.160.5+26.3

neo_version=26.3.0.1-beta
neoforge_loader_version_range=[1,)

# ModDevGradle 默认的 NeoForm 运行时 2.0.18 内置旧版 JST，无法对匿名类应用 AT，
# 会在重编译 net/minecraft/core/HolderSet.java 时因 HolderSet$1 可见性冲突而失败。
# 2.0.31 使用 JST 2.0.11，已能正确处理该匿名类。
neoForge.neoFormRuntime.version=2.0.31

mod_id=wings
mod_name=lv wings
mod_license=MIT
mod_version=1.1.11
mod_group_id=cc.lvjia.wings
mod_authors=pau101,jt789,ahasasjeb(lvjia)
mod_description=Port of Pau101's Wings mod with shared vanilla logic for Fabric and NeoForge.
mod_display_url=https://modrinth.com/mod/lv-wings
mod_logo=logo.png
mod_issue_url=https://github.com/ahasasjeb/lv-wings/issues
